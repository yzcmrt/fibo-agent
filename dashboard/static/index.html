<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crypto Fibo Agent</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #0b0f14; color: #e7edf5;
    }
    header {
      padding: 18px 24px; border-bottom: 1px solid #1d2733;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { margin: 0; font-size: 18px; letter-spacing: .04em; }
    header span { color: #8aa0b5; font-size: 12px; }
    main { display: grid; grid-template-columns: 1.3fr .7fr; gap: 16px; padding: 16px; }
    section { background: #121821; border: 1px solid #1d2733; border-radius: 14px; padding: 14px; }
    h2 { margin: 0 0 10px; font-size: 13px; color: #9bb0c4; text-transform: uppercase; letter-spacing: .08em; }
    .card { border: 1px solid #223042; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #0e141c; }
    .meta { color: #8aa0b5; font-size: 12px; }
    .lvls { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #d3e0ee; white-space: pre-wrap; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    button {
      background: #1b2734; color: #e7edf5; border: 1px solid #2a3b4d;
      border-radius: 8px; padding: 6px 10px; cursor: pointer;
    }
    button.hold { border-color: #2f6f4e; color: #b7f0cf; }
    button.fail { border-color: #7a3a3a; color: #f3b4b4; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; background: #1b2734; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .stat { background: #0e141c; border: 1px solid #223042; border-radius: 10px; padding: 10px 12px; min-width: 110px; }
    .stat b { display: block; font-size: 18px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Crypto Fibo Agent</h1>
    <span id="status">yükleniyor…</span>
    <button class="fail" onclick="kill(false)">Kill switch</button>
  </header>
  <main>
    <section>
      <h2>Mum + fib</h2>
      <div id="chart" style="height:280px"></div>
      <div class="meta" id="chartmeta">OHLCV yoksa boş kalır</div>
      <h2 style="margin-top:16px">CVD spark</h2>
      <div id="spark" class="lvls">—</div>
      <h2 style="margin-top:16px">Paper fill</h2>
      <div id="venues"></div>
      <h2 style="margin-top:16px">Canlı / üretilen fibler</h2>
      <div class="stats" id="stats"></div>
      <div id="drawings">Henüz çizim yok. Worker’ı çalıştırınca dolacak.</div>
    </section>
    <section>
      <h2>Raporlar ve öğrenilen bağlar</h2>
      <div id="reports"></div>
      <h2 style="margin-top:16px">Korelasyon</h2>
      <div id="corr"></div>
    </section>
  </main>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    async function kill(enabled) {
      await fetch('/api/kill', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({enabled})
      });
      load();
    }
    async function review(id, label) {
      await fetch('/api/review', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({drawing_id: id, label})
      });
      load();
    }
    function parseMaybe(s) {
      if (!s) return '';
      try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return String(s); }
    }
    async function load() {
      try {
        const res = await fetch('/api/overview');
        const data = await res.json();
        $('status').textContent = 'localhost bağlı';
        const reviews = Object.fromEntries((data.reviews || []).map(r => [r.label, r.n]));
        $('stats').innerHTML = `
          <div class="stat"><b>${(data.drawings||[]).length}</b><span class="meta">çizim</span></div>
          <div class="stat"><b>${reviews.hold || 0}</b><span class="meta">tuttu</span></div>
          <div class="stat"><b>${reviews.fail || 0}</b><span class="meta">tutmadı</span></div>
          <div class="stat"><b>${(data.forward && data.forward.done) || 0}</b><span class="meta">forward biten</span></div>
          <div class="stat"><b>${data.killed ? 'KİLİT' : 'açık'}</b><span class="meta">execution</span></div>
        `;
        $('drawings').innerHTML = (data.drawings || []).map(d => `
          <div class="card">
            <div><b>${d.symbol}</b> <span class="pill">${d.timeframe}</span> <span class="pill">${d.direction}</span> <span class="pill">${d.status || 'pending'}</span></div>
            <div class="meta">${d.origin_mode || 'wick'} · low ${d.swing_low} → high ${d.swing_high} · score ${d.confluence ?? '-'}</div>
            <div class="lvls">${parseMaybe(d.levels_json)}</div>
            <div class="row">
              <button class="hold" onclick="review(${d.id}, 'hold')">Tuttu</button>
              <button class="fail" onclick="review(${d.id}, 'fail')">Tutmadı</button>
              <button onclick="review(${d.id}, 'skip')">Atla</button>
            </div>
          </div>
        `).join('') || '<div class="meta">Kayıt yok</div>';
        $('reports').innerHTML = (data.reports || []).map(r => `
          <div class="card"><b>${r.title || r.kind}</b><div class="meta">${r.kind}</div><div>${(r.body || '').replaceAll('\\n','<br>')}</div></div>
        `).join('') || '<div class="meta">Rapor yok</div>';
        const venues = data.fills_by_venue || {};
        $('venues').innerHTML = ['okx','bybit'].map(v => `
          <div class="card"><b>${v}</b>
            ${(venues[v]||[]).map(f => `<div class="meta">${f.symbol} ${f.side} ${f.qty} @ ${f.price} ${f.note||''}</div>`).join('') || '<div class="meta">fill yok</div>'}
          </div>`).join('');
        const first = (data.drawings || [])[0];
        if (first) {
          fetch('/api/ohlcv?symbol=' + encodeURIComponent(first.symbol) + '&tf=' + encodeURIComponent(first.timeframe))
            .then(r => r.json()).then(ohlc => {
              $('chartmeta').textContent = first.symbol + ' ' + first.timeframe;
              if (window.LightweightCharts && ohlc.candles && ohlc.candles.length) {
                const el = $('chart');
                el.innerHTML = '';
                const chart = LightweightCharts.createChart(el, { layout: { background: { color: '#0e141c' }, textColor: '#9bb0c4' }, width: el.clientWidth, height: 280 });
                const series = chart.addCandlestickSeries();
                series.setData(ohlc.candles);
                try {
                  const lvls = JSON.parse(first.levels_json || '{}');
                  Object.values(lvls).forEach(p => series.createPriceLine({ price: Number(p), color: '#5b8def', lineWidth: 1 }));
                } catch (e) {}
              }
            });
          fetch('/api/cvd?symbol=' + encodeURIComponent(first.symbol))
            .then(r => r.json()).then(c => {
              const s = c.spark || [];
              $('spark').textContent = s.length ? s.map(x => x.toFixed(1)).join(' ') : 'CVD birikmiyor';
            });
        }
        $('corr').innerHTML = (data.correlations || []).map(c => `
          <div class="card"><b>${c.feature}</b><div class="meta">hold ${c.success_mean} / fail ${c.fail_mean} / w ${Number(c.weight).toFixed(3)}</div></div>
        `).join('') || '<div class="meta">Henüz korelasyon yok</div>';
      } catch (err) {
        $('status').textContent = 'API yok — worker/dashboard çalışmıyor';
      }
    }
    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
