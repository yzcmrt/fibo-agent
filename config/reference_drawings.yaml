# Manual drawings transcribed from the user's TradingView screenshots.
# Dual origin: wick = high/low, close = body. User trials both.

style:
  timeframes:
    internal: [5m, 15m]
    execution: [1h, 4h]
    structure: [1d]
  nested_grids: true
  origin_modes: [wick, close]
  uses_extensions_as_targets: true
  extension_set: [1.272, 1.618, 2.0, 2.618, 3.618, 4.236]
  retracement_set: [0.0, 0.236, 0.382, 0.5, 0.618, 0.786, 1.0]
  paints_confluence_bands: true
  keeps_historical_grids: true
  trendlines_on_swings: true
  emas: [20, 50, 100, 200]
  btc_mode: correction_only
  regret_note: "ETH and HYPE extension grids that later filled without a position."
  watchlist_regime:
    - BTC.D
    - USDT.D
    - USDC.D
    - TOTAL
    - TOTAL2
    - TOTAL3
    - OTHERS

